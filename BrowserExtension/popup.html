<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reprise for YouTube Music</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon32.png" alt="">
        <div>
          <h1>Reprise</h1>
          <p>YouTube Music Bridge</p>
        </div>
      </header>
      <section class="status-row">
        <span id="status-dot" class="status-dot"></span>
        <div>
          <strong id="status-title">연결 확인 중</strong>
          <p id="status-detail">Reprise를 찾고 있습니다.</p>
        </div>
      </section>
      <button id="open-youtube-music" type="button">YouTube Music 열기</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
