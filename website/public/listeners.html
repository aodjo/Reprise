<!doctype html>
<html lang="ko-KR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Reprise와 함께 듣는 음악. 최근 7일의 곡과 리스너 차트.">
  <title>Reprise · 리스너 차트</title>
  <link rel="preload" href="/assets/fonts/Pretendard-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=private-aggregation-1">
  <link rel="stylesheet" href="/listeners.css?v=listener-search-1">
  <script type="module" src="/app.js?v=private-history-2"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"></head>
<body class="listeners-page">
  <a class="skip-link" href="#listeners" data-i18n="skip">차트로 건너뛰기</a>
  <header class="navigation">
    <div class="navigation-inner container">
      <a class="brand brand-header" href="/" aria-label="Reprise 홈">
        <img class="brand-mark" src="/assets/logo-header-mark.svg" alt="" width="44.9355" height="28.9585">
        <img class="brand-word" src="/assets/logo-header-word.svg" alt="Reprise" width="87.6932" height="23.8939">
      </a>
      <nav aria-label="주 메뉴">
        <a href="/tracks" data-i18n="trackNav">곡 차트</a>
        <a href="/listeners" aria-current="page" data-i18n="listenerNav">리스너 차트</a>
        <button class="text-button" type="button" data-action="account" data-i18n="profile">내 프로필</button>
      </nav>
      <div class="account-control">
        <button id="account-button" class="account-button text-button" type="button">
          <span data-i18n="signIn">로그인</span>
        </button>
        <div id="account-menu" class="account-menu" role="menu" aria-labelledby="account-button" hidden>
          <button id="account-menu-profile" type="button" role="menuitem"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" stroke="currentColor" stroke-width="0" fill="none" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-icon="CgProfile"><path fill-rule="evenodd" clip-rule="evenodd" d="M16 9C16 11.2091 14.2091 13 12 13C9.79086 13 8 11.2091 8 9C8 6.79086 9.79086 5 12 5C14.2091 5 16 6.79086 16 9ZM14 9C14 10.1046 13.1046 11 12 11C10.8954 11 10 10.1046 10 9C10 7.89543 10.8954 7 12 7C13.1046 7 14 7.89543 14 9Z" fill="currentColor"></path><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1ZM3 12C3 14.0902 3.71255 16.014 4.90798 17.5417C6.55245 15.3889 9.14627 14 12.0645 14C14.9448 14 17.5092 15.3531 19.1565 17.4583C20.313 15.9443 21 14.0524 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12ZM12 21C9.84977 21 7.87565 20.2459 6.32767 18.9878C7.59352 17.1812 9.69106 16 12.0645 16C14.4084 16 16.4833 17.1521 17.7538 18.9209C16.1939 20.2191 14.1881 21 12 21Z" fill="currentColor"></path></svg><span data-i18n="profile">내 프로필</span></button>
          <button id="account-menu-logout" type="button" role="menuitem"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" stroke="currentColor" stroke-width="0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-icon="GrLogout"><path fill="none" stroke-width="2" d="M13,9 L13,2 L1,2 L1,22 L13,22 L13,15 M22,12 L5,12 M17,7 L22,12 L17,17"></path></svg><span data-i18n="signOut">로그아웃</span></button>
          <p id="account-menu-error" class="account-menu-error" role="status" hidden></p>
        </div>
      </div>
    </div>
  </header>
  <main class="listener-chart-main container">
    <div class="listeners-content">
      <header class="listener-chart-heading">
        <h1 data-i18n="listenerNav">리스너 차트</h1>
        <p id="chart-period" class="listener-chart-period"></p>
      </header>
      <div id="service-status" class="service-status" role="status" hidden></div>
      <div class="listener-chart-layout">
        <aside class="listener-feature-column" aria-label="1위 리스너">
          <button id="featured-listener" class="featured-listener" type="button" hidden>
            <span class="listener-rank-badge" data-i18n="firstPlace">1위</span>
            <strong id="featured-listener-name" class="featured-listener-name"></strong>
            <span id="featured-listener-time" class="featured-listener-time"></span>
            <span class="featured-listener-label" data-i18n="listeningTime">청취 시간</span>
            <span class="featured-listener-link" data-i18n="viewProfile">프로필 보기 →</span>
            <span id="listener-sleeves" class="listener-sleeves" aria-hidden="true"></span>
          </button>
          <p id="leader-empty" class="leader-empty" data-i18n="loading">차트를 불러오고 있어요.</p>
          <section id="leader-albums" class="leader-albums" aria-labelledby="leader-albums-heading" hidden>
            <h2 id="leader-albums-heading" data-i18n="leaderAlbums">1위 리스너의 음반</h2>
            <ol id="favourite-albums" class="favourite-albums"></ol>
            <p id="albums-empty" class="empty-state" data-i18n="noAlbums" hidden>아직 집계된 음반이 없어요.</p>
          </section>
        </aside>
        <section id="listeners" class="weekly-listeners" tabindex="-1" aria-labelledby="listeners-heading">
          <div class="listener-ranking-heading">
            <h2 id="listeners-heading" data-i18n="weeklyListeners">주간 리스너 순위</h2>
            <p data-i18n="listenersDescription">최근 7일 청취 시간</p>
            <label class="listener-search" for="listener-search">
              <span class="sr-only" data-i18n="searchListeners">표시 이름 또는 사용자 이름 검색</span>
              <img src="/assets/chart-search.svg" alt="" width="18" height="18">
              <input id="listener-search" type="search" maxlength="300" autocomplete="off" placeholder="표시 이름 또는 사용자 이름 검색" aria-controls="listener-list">
            </label>
          </div>
          <ol id="listener-list" class="listener-list" aria-live="polite"></ol>
          <p id="listeners-empty" class="empty-state" role="status" data-i18n="loading">차트를 불러오고 있어요.</p>
        </section>
      </div>
    </div>
      <footer class="footer listeners-footer">
        <div class="footer-introduction">
          <a class="brand brand-footer" href="/" aria-label="Reprise 홈"><span class="footer-logo-scale">
            <img class="brand-mark" src="/assets/logo-footer-mark.svg" alt="" width="66.5526" height="42.8895">
            <img class="brand-word" src="/assets/logo-footer-word.svg" alt="Reprise" width="129.88" height="35.3886">
          </span></a>
          <p data-i18n="introduction">메뉴바 음악 컨트롤러, Reprise.</p>
        </div>
        <div class="footer-links">
          <div class="policy-links"><a class="privacy" href="/privacy" data-i18n="privacy">개인정보 처리방침</a><a href="/terms" data-i18n="terms">이용약관</a><a href="https://github.com/aodjo/reprise" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
          <label class="language-picker"><span class="sr-only" data-i18n="language">언어</span><select id="language"><option value="ko-KR">한국어</option><option value="en-US">English</option></select><span class="language-chevron" aria-hidden="true"></span></label>
        </div>
      </footer>
  </main>
  <dialog id="panel" aria-labelledby="panel-title">
    <div class="dialog-header"><h2 id="panel-title"></h2><button id="close-panel" type="button" class="close-button" aria-label="닫기">×</button></div>
    <div id="panel-content"></div>
    <p id="panel-message" class="form-message" role="status"></p>
  </dialog>
</body>
</html>
