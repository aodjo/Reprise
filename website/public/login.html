<!doctype html>
<html lang="ko-KR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>로그인 · Reprise</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=20261121-chevron"><link rel="stylesheet" href="/login.css?v=3">
  <script type="module" src="/login.js?v=3"></script>
</head>
<body class="login-page">
  <header class="login-header container"><a class="brand brand-header" href="/" aria-label="Reprise">
    <img class="brand-mark" src="/assets/logo-header-mark.svg" alt="" width="44.9355" height="28.9585">
    <img class="brand-word" src="/assets/logo-header-word.svg" alt="Reprise" width="87.6932" height="23.8939">
  </a><a class="login-back" href="/" data-copy="back">차트로 돌아가기</a></header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title" data-copy="title">Reprise에 로그인</h1>
      <div id="connection-note" class="connection-note" hidden><span class="connection-icon" aria-hidden="true">↔</span><p data-copy="connection">로그인 후 Reprise 앱을 연결합니다.</p></div>
      <form id="login-form">
        <label class="login-agreement"><input id="login-agreement" type="checkbox" required><span data-copy="agreement">만 14세 이상이며 이용약관에 동의하고 개인정보 처리방침을 확인했습니다.</span></label>
        <button id="google-login" class="google-login" type="submit" disabled><img src="/assets/google-g.png" alt="" width="18" height="18" aria-hidden="true"><span data-copy="google">Google로 계속하기</span></button>
        <p class="login-policy-links"><a href="/terms" target="_blank" rel="noopener" data-copy="terms">이용약관</a><span aria-hidden="true">·</span><a href="/privacy" target="_blank" rel="noopener" data-copy="privacy">개인정보 처리방침</a></p>
        <p id="login-status" role="status" aria-live="polite" class="login-status" data-copy="loading">로그인을 준비하고 있어요.</p>
      </form>
    </section>
  </main>
  <footer class="login-footer container"><p>© 2026 Reprise</p><label class="language-picker"><span class="sr-only" data-copy="language">언어</span><select id="login-language"><option value="ko-KR">한국어</option><option value="en-US">English</option></select><span class="language-chevron" aria-hidden="true"></span></label></footer>
</body>
</html>
