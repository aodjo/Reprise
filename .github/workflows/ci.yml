name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-layout:
    name: Repository layout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate cross-platform boundaries
        shell: bash
        run: |
          required_directories=(
            src/Reprise.Core
            src/Reprise.Desktop
            src/Reprise.Platform.MacOS
            src/Reprise.Platform.Windows
            src/Reprise.Platform.Linux
            tests/unit/Reprise.Core.Tests
            tests/contracts/Reprise.Platform.Contracts.Tests
            tests/integration/macos/common
            tests/integration/windows/common
            tests/integration/linux/common
            packaging/macos
            packaging/windows
            packaging/linux
            BrowserExtension/Shared
          )

          for directory in "${required_directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "Missing required directory: $directory" >&2
              exit 1
            fi
          done

  browser-extension:
    name: Browser extension (${{ matrix.browser }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: Chromium
            source: Chromium
            target: windows-2025-x64
            runner: windows-2025
          - browser: Chromium
            source: Chromium
            target: windows-11-arm64
            runner: windows-11-arm
          - browser: Chromium
            source: Chromium
            target: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - browser: Chromium
            source: Chromium
            target: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
          - browser: Mozilla
            source: Mozilla
            target: windows-2025-x64
            runner: windows-2025
          - browser: Mozilla
            source: Mozilla
            target: windows-11-arm64
            runner: windows-11-arm
          - browser: Mozilla
            source: Mozilla
            target: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - browser: Mozilla
            source: Mozilla
            target: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find 'BrowserExtension/${{ matrix.source }}' \
            -type f -name '*.js' -print0 \
            | xargs -0 -n 1 node --check

      - name: Validate extension manifest
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`Validated ${file}`);
          ' 'BrowserExtension/${{ matrix.source }}/manifest.json'

      - name: Run browser extension tests
        shell: bash
        env:
          REPRISE_EXTENSION_TARGET: ${{ matrix.source }}
        run: |
          mkdir -p TestResults
          node --test BrowserExtension/Tests/*.test.mjs \
            | tee 'TestResults/${{ matrix.browser }}-${{ matrix.target }}.tap'

      - name: Upload browser extension test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-${{ matrix.browser }}-${{ matrix.target }}-test-results
          path: TestResults/${{ matrix.browser }}-${{ matrix.target }}.tap
          if-no-files-found: warn
          retention-days: 7

  chromium-extension-package:
    name: Chromium extension ZIP
    needs: browser-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Chromium extension ZIP
        shell: bash
        run: |
          mkdir -p Artifacts/chromium-web-store
          cp -R BrowserExtension/Chromium/. Artifacts/chromium-web-store/

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("Artifacts/chromium-web-store/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.pop("key", None)
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd Artifacts/chromium-web-store
            zip -Xqr ../reprise-chromium.zip . \
              -x '*.DS_Store' '__MACOSX/*'
          )

      - name: Verify Chromium extension ZIP
        shell: bash
        run: |
          unzip -t Artifacts/reprise-chromium.zip
          unzip -Z1 Artifacts/reprise-chromium.zip \
            | grep -qx 'manifest.json'
          unzip -p Artifacts/reprise-chromium.zip manifest.json \
            | python3 -c '
          import json
          import sys

          manifest = json.load(sys.stdin)
          if "key" in manifest:
              raise SystemExit("Web Store manifest must not contain key")
          '

      - name: Upload Chromium extension ZIP
        uses: actions/upload-artifact@v7
        with:
          name: reprise-chromium-extension
          path: Artifacts/reprise-chromium.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-15-arm64
            runner: macos-15
            architecture: arm64
          - target: macos-15-x64
            runner: macos-15-intel
            architecture: x86_64
          - target: macos-26-arm64
            runner: macos-26
            architecture: arm64
          - target: macos-26-x64
            runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        shell: bash
        run: |
          uname -a
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/Reprise.Platform.MacOS/Reprise.xcodeproj \
            -scheme Reprise

      - name: Run macOS unit tests
        shell: bash
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project src/Reprise.Platform.MacOS/Reprise.xcodeproj \
            -scheme Reprise \
            -destination 'platform=macOS,arch=${{ matrix.architecture }}' \
            -only-testing:RepriseTests \
            -derivedDataPath 'DerivedData/${{ matrix.target }}' \
            -resultBundlePath 'TestResults/${{ matrix.target }}.xcresult' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-xcresult
          path: TestResults/${{ matrix.target }}.xcresult
          if-no-files-found: warn
          retention-days: 7
