name: Linux

on:
  push:
    branches:
      - main
      - develop
    paths:
      - src/Reprise.Core/**
      - src/Reprise.Desktop/**
      - src/Reprise.Platform.Linux/**
      - BrowserExtension/Chromium/icons/icon32.png
      - BrowserExtension/Chromium/icons/icon128.png
      - tests/unit/**
      - tests/contracts/**
      - tests/integration/linux/**
      - tests/fixtures/**
      - tests/matrix/targets.json
      - packaging/linux/**
      - Reprise.sln
      - Reprise.slnx
      - global.json
      - Directory.Build.*
      - Directory.Packages.props
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - src/Reprise.Core/**
      - src/Reprise.Desktop/**
      - src/Reprise.Platform.Linux/**
      - BrowserExtension/Chromium/icons/icon32.png
      - BrowserExtension/Chromium/icons/icon128.png
      - tests/unit/**
      - tests/contracts/**
      - tests/integration/linux/**
      - tests/fixtures/**
      - tests/matrix/targets.json
      - packaging/linux/**
      - Reprise.sln
      - Reprise.slnx
      - global.json
      - Directory.Build.*
      - Directory.Packages.props
      - .github/workflows/linux.yml
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: Prepare Linux test matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate and filter Linux targets
        id: prepare
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_platform = "linux"
          matrix_path = Path("tests/matrix/targets.json")
          payload = json.loads(matrix_path.read_text(encoding="utf-8"))
          targets = payload.get("targets")
          if not isinstance(targets, list) or not targets:
              raise SystemExit("tests/matrix/targets.json must contain targets")

          required = {
              "target",
              "runner",
              "platform",
              "architecture",
              "runtime",
              "execution",
          }
          names = set()
          selected = []
          for index, target in enumerate(targets):
              missing = required.difference(target)
              if missing:
                  raise SystemExit(
                      f"target {index} is missing: {sorted(missing)}"
                  )
              name = target["target"]
              if name in names:
                  raise SystemExit(f"duplicate target: {name}")
              names.add(name)
              if target["platform"] not in {"windows", "linux"}:
                  raise SystemExit(
                      f"unsupported placeholder platform: {target['platform']}"
                  )
              if target["platform"] == expected_platform:
                  selected.append(target)

          if not selected:
              raise SystemExit("no Linux targets were configured")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(
                  "matrix="
                  + json.dumps({"include": selected}, separators=(",", ":"))
                  + "\n"
              )

          print(f"Prepared {len(selected)} Linux test targets.")
          PY

  platform-tests:
    name: Linux (${{ matrix.target }})
    needs: test-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show target environment
        shell: bash
        run: |
          echo 'Target: ${{ matrix.target }}'
          echo 'Runtime: ${{ matrix.runtime }}'
          echo 'Execution: ${{ matrix.execution }}'
          uname -a

      - name: Discover Linux tests
        id: discover
        shell: bash
        run: |
          search_directories=(
            tests/unit
            tests/contracts
            tests/integration/linux/common
            tests/integration/linux/${{ matrix.architecture }}
          )

          test_projects=()
          for directory in "${search_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r project; do
                test_projects+=("$project")
              done < <(find "$directory" -type f -name '*.csproj' -print | sort)
            fi
          done

          if [[ "${#test_projects[@]}" -eq 0 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '### ${{ matrix.target }}'
              echo
              echo 'No Linux test projects exist yet. Test steps were skipped.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"
          printf 'Discovered test project: %s\n' "${test_projects[@]}"

      - name: Set up .NET
        if: steps.discover.outputs.ready == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Linux application
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          dotnet restore \
            src/Reprise.Platform.Linux/Reprise.Platform.Linux.csproj \
            --runtime '${{ matrix.runtime }}'

      - name: Publish Linux application
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          publish_directory="$GITHUB_WORKSPACE/Artifacts/${{ matrix.target }}/app"
          dotnet publish \
            src/Reprise.Platform.Linux/Reprise.Platform.Linux.csproj \
            --configuration Release \
            --runtime '${{ matrix.runtime }}' \
            --self-contained true \
            --no-restore \
            --output "$publish_directory"

      - name: Smoke test Linux executable
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          'Artifacts/${{ matrix.target }}/app/reprise' --health-check

      - name: Run applicable tests
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          result_directory="$GITHUB_WORKSPACE/TestResults/${{ matrix.target }}"
          mkdir -p "$result_directory"

          search_directories=(
            tests/unit
            tests/contracts
            tests/integration/linux/common
            tests/integration/linux/${{ matrix.architecture }}
          )

          test_projects=()
          for directory in "${search_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r project; do
                test_projects+=("$project")
              done < <(find "$directory" -type f -name '*.csproj' -print | sort)
            fi
          done

          for project in "${test_projects[@]}"; do
            project_name="$(basename "$project" .csproj)"
            dotnet test "$project" \
              --configuration Release \
              --runtime '${{ matrix.runtime }}' \
              --results-directory "$result_directory" \
              --logger "trx;LogFileName=${project_name}.trx"
          done

      - name: Package Linux application
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          artifact_directory="Artifacts/${{ matrix.target }}"
          cp packaging/linux/dev.junx.Reprise.desktop "$artifact_directory/"
          cp packaging/linux/README.md "$artifact_directory/"
          cp packaging/linux/install-gnome-extension.sh "$artifact_directory/"
          cp -r packaging/linux/gnome-extension "$artifact_directory/"
          tar \
            -C Artifacts \
            -czf "Artifacts/reprise-${{ matrix.runtime }}.tar.gz" \
            '${{ matrix.target }}'

      - name: Build Debian package
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          case '${{ matrix.architecture }}' in
            x64) debian_architecture=amd64 ;;
            arm64) debian_architecture=arm64 ;;
            *) echo 'unsupported architecture' >&2; exit 1 ;;
          esac

          version="$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)"
          suffix="$(grep -oPm1 '(?<=<VersionSuffix>)[^<]+' Directory.Build.props || true)"
          if [[ -n "$suffix" ]]; then
            version="$version~$suffix"
          fi

          packaging/linux/build-deb.sh \
            "Artifacts/${{ matrix.target }}/app" \
            "$debian_architecture" \
            "$version" \
            Artifacts

          ls Artifacts/*.deb

      - name: Build AppImage
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          case '${{ matrix.architecture }}' in
            x64) appimage_architecture=x86_64 ;;
            arm64) appimage_architecture=aarch64 ;;
            *) echo 'unsupported architecture' >&2; exit 1 ;;
          esac

          version="$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)"
          suffix="$(grep -oPm1 '(?<=<VersionSuffix>)[^<]+' Directory.Build.props || true)"
          if [[ -n "$suffix" ]]; then
            version="$version-$suffix"
          fi

          packaging/linux/build-appimage.sh \
            "Artifacts/${{ matrix.target }}/app" \
            "$appimage_architecture" \
            "$version" \
            Artifacts

      - name: Upload Linux application
        if: steps.discover.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reprise-${{ matrix.runtime }}
          path: |
            Artifacts/reprise-${{ matrix.runtime }}.tar.gz
            Artifacts/*.deb
            Artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux test results
        if: ${{ always() && steps.discover.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-test-results
          path: TestResults/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7

  publish-repository:
    name: Publish the apt repository
    needs: platform-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: apt-repository
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download built packages
        uses: actions/download-artifact@v6
        with:
          pattern: reprise-linux-*
          path: Downloads

      - name: Install packaging tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch the published site
        shell: bash
        run: |
          # The site holds both channels, and each branch rewrites only its
          # own, so the run has to start from what is already published
          # rather than from an empty directory.
          if ! git clone --branch apt-repo --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" Site; then
            mkdir Site
            git -C Site init -q -b apt-repo
            git -C Site remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Update this channel
        shell: bash
        run: |
          if [[ '${{ github.ref }}' == 'refs/heads/main' ]]; then
            suite=stable
          else
            suite=develop
          fi
          echo "Publishing to the $suite channel."

          packaging/linux/build-apt-repo.sh \
            Downloads \
            Site \
            "${{ steps.pages.outputs.base_url }}" \
            "$suite"

          # The AppImages ride along, one directory per channel.
          mkdir -p "Site/downloads/$suite"
          rm -f "Site/downloads/$suite"/*.AppImage
          find Downloads -name '*.AppImage' -exec cp {} "Site/downloads/$suite/" \;
          find Site -maxdepth 3 -type d | sort

      - name: Commit the site
        shell: bash
        run: |
          cd Site
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -q -m "chore: publish ${{ github.ref_name }} build ${{ github.run_number }}"
            git push -q origin HEAD:apt-repo
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: Site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
