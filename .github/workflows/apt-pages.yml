name: Apt Pages

on:
  push:
    branches:
      - apt-repo
    paths:
      - dists/**
      - pool/**
      - downloads/**
      - windows/**
      - index.html
      - .nojekyll
      - .github/workflows/apt-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy published desktop packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the package repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage current downloads within the Pages size limit
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          source = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'reprise-pages'
          shutil.copytree(source, target, ignore=shutil.ignore_patterns('.git'))
          for packages in target.glob('windows/*/*/packages'):
              feed = packages.parent / 'update.json'
              if not feed.is_file():
                  continue
              current = json.loads(feed.read_text())['fileName']
              if Path(current).name != current or not (packages / current).is_file():
                  raise RuntimeError('Current Windows download is missing: ' + str(feed))
              builds = []
              for package in packages.glob('Reprise-*-Setup.exe'):
                  stamp = re.search(r'(\d{14})-Setup\.exe$', package.name)
                  if stamp:
                      builds.append((stamp.group(1), package))
              builds.sort(key=lambda item: item[0], reverse=True)
              keep = {current, *(package.name for _, package in builds[:3])}
              for _, package in builds:
                  if package.name not in keep:
                      package.unlink()
          total = sum(path.stat().st_size for path in target.rglob('*') if path.is_file())
          if total > 1024 ** 3:
              raise RuntimeError(f'Pages content exceeds 1 GiB: {total} bytes')
          print(f'Staged {total} bytes; all original packages remain in the artifact repository.')
          PY

      - name: Upload the package repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/reprise-pages

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
