name: Browser extension - Chromium

on:
  push:
    branches:
      - main
      - develop
    paths:
      - BrowserExtension/Chromium/**
      - BrowserExtension/Shared/**
      - BrowserExtension/Tests/**
      - .github/workflows/browser-chromium.yml
  pull_request:
    paths:
      - BrowserExtension/Chromium/**
      - BrowserExtension/Shared/**
      - BrowserExtension/Tests/**
      - .github/workflows/browser-chromium.yml
  workflow_dispatch:

concurrency:
  group: browser-chromium-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Chromium (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-2025-x64
            runner: windows-2025
          - target: windows-11-arm64
            runner: windows-11-arm
          - target: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - target: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find BrowserExtension/Chromium \
            -type f -name '*.js' -print0 \
            | xargs -0 -n 1 node --check

      - name: Validate extension manifest
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`Validated ${file}`);
          ' BrowserExtension/Chromium/manifest.json

      - name: Run Chromium extension tests
        shell: bash
        env:
          REPRISE_EXTENSION_TARGET: Chromium
        run: |
          mkdir -p TestResults
          node --test BrowserExtension/Tests/*.test.mjs \
            | tee 'TestResults/Chromium-${{ matrix.target }}.tap'

      - name: Upload Chromium test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-Chromium-${{ matrix.target }}-test-results
          path: TestResults/Chromium-${{ matrix.target }}.tap
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Chromium extension ZIP
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Chromium extension ZIP
        shell: bash
        run: |
          mkdir -p Artifacts/chromium-web-store
          cp -R BrowserExtension/Chromium/. Artifacts/chromium-web-store/

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("Artifacts/chromium-web-store/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.pop("key", None)
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd Artifacts/chromium-web-store
            zip -Xqr ../reprise-chromium.zip . \
              -x '*.DS_Store' '__MACOSX/*'
          )

      - name: Verify Chromium extension ZIP
        shell: bash
        run: |
          unzip -t Artifacts/reprise-chromium.zip
          unzip -Z1 Artifacts/reprise-chromium.zip \
            | grep -qx manifest.json
          unzip -p Artifacts/reprise-chromium.zip manifest.json \
            | python3 -c '
          import json
          import sys

          manifest = json.load(sys.stdin)
          if "key" in manifest:
              raise SystemExit("Web Store manifest must not contain key")
          '

      - name: Upload Chromium extension ZIP
        uses: actions/upload-artifact@v7
        with:
          name: reprise-chromium-extension
          path: Artifacts/reprise-chromium.zip
          if-no-files-found: error
          retention-days: 14
