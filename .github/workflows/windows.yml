name: Windows

on:
  push:
    branches:
      - main
      - develop
    paths:
      - src/Reprise.Core/**
      - src/Reprise.Desktop/**
      - src/Reprise.Platform.Windows/**
      - tests/unit/**
      - tests/contracts/**
      - tests/integration/windows/**
      - tests/fixtures/**
      - tests/matrix/targets.json
      - packaging/windows/**
      - packaging/linux/update_channels.py
      - tests/packaging/windows/**
      - Reprise.sln
      - Reprise.slnx
      - global.json
      - Directory.Build.*
      - Directory.Packages.props
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - src/Reprise.Core/**
      - src/Reprise.Desktop/**
      - src/Reprise.Platform.Windows/**
      - tests/unit/**
      - tests/contracts/**
      - tests/integration/windows/**
      - tests/fixtures/**
      - tests/matrix/targets.json
      - packaging/windows/**
      - packaging/linux/update_channels.py
      - tests/packaging/windows/**
      - Reprise.sln
      - Reprise.slnx
      - global.json
      - Directory.Build.*
      - Directory.Packages.props
      - .github/workflows/windows.yml
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: Prepare Windows test matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate and filter Windows targets
        id: prepare
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_platform = "windows"
          matrix_path = Path("tests/matrix/targets.json")
          payload = json.loads(matrix_path.read_text(encoding="utf-8"))
          targets = payload.get("targets")
          if not isinstance(targets, list) or not targets:
              raise SystemExit("tests/matrix/targets.json must contain targets")

          required = {
              "target",
              "runner",
              "platform",
              "architecture",
              "runtime",
              "execution",
          }
          names = set()
          selected = []
          for index, target in enumerate(targets):
              missing = required.difference(target)
              if missing:
                  raise SystemExit(
                      f"target {index} is missing: {sorted(missing)}"
                  )
              name = target["target"]
              if name in names:
                  raise SystemExit(f"duplicate target: {name}")
              names.add(name)
              if target["platform"] not in {"windows", "linux"}:
                  raise SystemExit(
                      f"unsupported platform: {target['platform']}"
                  )
              if target["platform"] == expected_platform:
                  selected.append(target)

          if not selected:
              raise SystemExit("no Windows targets were configured")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(
                  "matrix="
                  + json.dumps({"include": selected}, separators=(",", ":"))
                  + "\n"
              )

          print(f"Prepared {len(selected)} Windows test targets.")
          PY

  platform-tests:
    name: Windows (${{ matrix.target }})
    needs: test-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show target environment
        shell: bash
        run: |
          echo 'Target: ${{ matrix.target }}'
          echo 'Runtime: ${{ matrix.runtime }}'
          echo 'Execution: ${{ matrix.execution }}'
          uname -a || true
          echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-not-set}"

      - name: Discover Windows tests
        id: discover
        shell: bash
        run: |
          search_directories=(
            tests/unit
            tests/contracts
            tests/integration/windows/common
            tests/integration/windows/${{ matrix.architecture }}
          )

          test_projects=()
          for directory in "${search_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r project; do
                test_projects+=("$project")
              done < <(find "$directory" -type f -name '*.csproj' -print | sort)
            fi
          done

          if [[ "${#test_projects[@]}" -eq 0 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '### ${{ matrix.target }}'
              echo
              echo 'No Windows test projects exist yet. Test steps were skipped.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"
          printf 'Discovered test project: %s\n' "${test_projects[@]}"

      - name: Set up .NET
        if: steps.discover.outputs.ready == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run applicable tests
        if: steps.discover.outputs.ready == 'true'
        shell: bash
        run: |
          result_directory="$GITHUB_WORKSPACE/TestResults/${{ matrix.target }}"
          mkdir -p "$result_directory"

          search_directories=(
            tests/unit
            tests/contracts
            tests/integration/windows/common
            tests/integration/windows/${{ matrix.architecture }}
          )

          test_projects=()
          for directory in "${search_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r project; do
                test_projects+=("$project")
              done < <(find "$directory" -type f -name '*.csproj' -print | sort)
            fi
          done

          for project in "${test_projects[@]}"; do
            project_name="$(basename "$project" .csproj)"
            dotnet test "$project" \
              --configuration Release \
              --runtime '${{ matrix.runtime }}' \
              -p:SelfContained=true \
              --results-directory "$result_directory" \
              --logger "trx;LogFileName=${project_name}.trx"
          done

      - name: Verify native Windows settings lifecycle
        if: steps.discover.outputs.ready == 'true'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'Artifacts/settings-${{ matrix.architecture }}'
          dotnet publish tests/fixtures/windows/native-player/NativePlayer.csproj --configuration Release --runtime '${{ matrix.runtime }}' --self-contained true --output $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Settings diagnostic build failed.' }
          $process = Start-Process (Join-Path $fixture 'Reprise.Platform.Windows.Tests.exe') -ArgumentList '--verify-settings' -WorkingDirectory $fixture -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Settings lifecycle verification timed out.'
          }
          $results = Join-Path $env:GITHUB_WORKSPACE 'TestResults/${{ matrix.target }}/settings'
          New-Item -ItemType Directory $results -Force | Out-Null
          Copy-Item "$fixture/settings-*.json", "$fixture/settings-tab-*.png" $results -ErrorAction SilentlyContinue
          $result = Get-Content (Join-Path $fixture 'settings-result.json') | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok -or $result.visited.Count -ne 18 -or -not $result.preferencePersisted -or -not $result.reservationPersisted) {
            throw ('Settings lifecycle verification failed: ' + ($result | ConvertTo-Json -Depth 5))
          }

      - name: Verify first-letter fade on the native renderer
        if: steps.discover.outputs.ready == 'true'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'Artifacts/settings-${{ matrix.architecture }}'
          $process = Start-Process (Join-Path $fixture 'Reprise.Platform.Windows.Tests.exe') -ArgumentList '--verify-fade' -WorkingDirectory $fixture -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'First-letter fade verification timed out.'
          }
          $results = Join-Path $env:GITHUB_WORKSPACE 'TestResults/${{ matrix.target }}/fade'
          New-Item -ItemType Directory $results -Force | Out-Null
          Copy-Item "$fixture/fade-*.json", "$fixture/fade-*.png" $results -ErrorAction SilentlyContinue
          $result = Get-Content (Join-Path $fixture 'fade-result.json') | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            throw ('First-letter fade verification failed: ' + ($result | ConvertTo-Json -Depth 5))
          }

      - name: Verify player lyric highlighting through provider gaps and reopen
        if: steps.discover.outputs.ready == 'true'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'Artifacts/settings-${{ matrix.architecture }}'
          $process = Start-Process (Join-Path $fixture 'Reprise.Platform.Windows.Tests.exe') -ArgumentList '--verify-lyrics-highlight' -WorkingDirectory $fixture -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Player lyric highlighting verification timed out.'
          }
          $results = Join-Path $env:GITHUB_WORKSPACE 'TestResults/${{ matrix.target }}/lyrics'
          New-Item -ItemType Directory $results -Force | Out-Null
          Copy-Item "$fixture/lyrics-*.json", "$fixture/lyrics-*.png" $results -ErrorAction SilentlyContinue
          $result = Get-Content (Join-Path $fixture 'lyrics-result.json') | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            throw ('Player lyric highlighting verification failed: ' + ($result | ConvertTo-Json -Depth 5))
          }

      - name: Upload Windows test results
        if: ${{ always() && steps.discover.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-test-results
          path: TestResults/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run Windows publication tests
        shell: pwsh
        run: python -m unittest discover -s tests/packaging/windows/common -v

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Build self-contained Windows installer
        shell: pwsh
        run: python packaging/windows/build.py --architecture '${{ matrix.architecture }}'

      - name: Check Windows executable
        shell: pwsh
        run: |
          $app = Get-ChildItem 'Artifacts/windows-${{ matrix.architecture }}/*/app/Reprise.exe' | Select-Object -Last 1
          $process = Start-Process $app.FullName -ArgumentList '--health-check' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows health check failed: $($process.ExitCode)" }

      - name: Upload installer and portable application
        uses: actions/upload-artifact@v7
        with:
          name: reprise-${{ matrix.runtime }}
          path: |
            Artifacts/windows-${{ matrix.architecture }}/*/*-Setup.exe
            Artifacts/windows-${{ matrix.architecture }}/*/*.zip
            Artifacts/windows-${{ matrix.architecture }}/*/update.json
          if-no-files-found: error
          retention-days: 14
