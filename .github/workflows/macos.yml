name: macOS

on:
  push:
    branches:
      - main
      - develop
    paths:
      - src/Reprise.Core/**
      - src/Reprise.Desktop/**
      - src/Reprise.Platform.MacOS/**
      - tests/integration/macos/**
      - packaging/macos/**
      - .github/workflows/macos.yml
  pull_request:
    paths:
      - src/Reprise.Core/**
      - src/Reprise.Desktop/**
      - src/Reprise.Platform.MacOS/**
      - tests/integration/macos/**
      - packaging/macos/**
      - .github/workflows/macos.yml
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-15-arm64
            runner: macos-15
            architecture: arm64
          - target: macos-15-x64
            runner: macos-15-intel
            architecture: x86_64
          - target: macos-26-arm64
            runner: macos-26
            architecture: arm64
          - target: macos-26-x64
            runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        shell: bash
        run: |
          uname -a
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/Reprise.Platform.MacOS/Reprise.xcodeproj \
            -scheme Reprise

      - name: Run macOS unit tests
        shell: bash
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project src/Reprise.Platform.MacOS/Reprise.xcodeproj \
            -scheme Reprise \
            -destination 'platform=macOS,arch=${{ matrix.architecture }}' \
            -only-testing:RepriseTests \
            '-skip-testing:RepriseTests/YouTubeMusicBridgeTests/localWebSocketTransfersSnapshotsAndCommands()' \
            -derivedDataPath 'DerivedData/${{ matrix.target }}' \
            -resultBundlePath 'TestResults/${{ matrix.target }}.xcresult' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-xcresult
          path: TestResults/${{ matrix.target }}.xcresult
          if-no-files-found: warn
          retention-days: 7

  websocket-integration:
    name: macOS WebSocket integration (macos-15-arm64)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        shell: bash
        run: |
          uname -a
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/Reprise.Platform.MacOS/Reprise.xcodeproj \
            -scheme Reprise

      - name: Run WebSocket integration test
        shell: bash
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project src/Reprise.Platform.MacOS/Reprise.xcodeproj \
            -scheme Reprise \
            -destination 'platform=macOS,arch=arm64' \
            '-only-testing:RepriseTests/YouTubeMusicBridgeTests/localWebSocketTransfersSnapshotsAndCommands()' \
            -derivedDataPath DerivedData/macos-15-arm64-websocket \
            -resultBundlePath TestResults/macos-15-arm64-websocket.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload WebSocket integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-15-arm64-websocket-xcresult
          path: TestResults/macos-15-arm64-websocket.xcresult
          if-no-files-found: warn
          retention-days: 7
